[package]
publish = false
description = "Cordis framework: cordis-wasm"
name = "cordis-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
loader = ["dep:cordis-loader"]

[dependencies]
cordis-runtime.workspace = true
cordis-contract.workspace = true
cordis-kernel.workspace = true
cordis-component.workspace = true
cordis-wire.workspace = true
prost.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
wasmtime = { version = "=49.0.2", default-features = false, features = ["std", "runtime", "component-model", "component-model-async", "cranelift", "gc-drc"] }
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p2"] }
getrandom = "0.3"
sha2 = "0.10"
cordis-loader = { workspace = true, optional = true }

[[example]]
name = "reload"
required-features = ["loader"]

[[example]]
name = "rolling"
required-features = ["loader"]

[[example]]
name = "preparation"
required-features = ["loader"]

[dev-dependencies]
cordis-example-contracts.workspace = true
cordis-test-contracts.workspace = true
cordis-sdk-core.workspace = true
cordis-sdk-runtime.workspace = true
cordis-portable-example = { path = "../../sdk/rust/examples/portable" }
wasi-preview1-component-adapter-provider = "=43.0.1"
cordis-sdk.workspace = true
cordis-abi = { path = "../cordis-abi" }
cordis-remote = { path = "../cordis-remote" }
wit-component = "=0.258.3"
wit-parser = "=0.258.3"
wat = "=1.258.3"
wasmparser = "=0.258.3"
wasm-encoder = "=0.258.3"

# The library itself forbids unsafe. Backend comparison tests explicitly load
# the trusted C ABI fixture and inherit that loader's safety contract.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
await_holding_lock = "deny"
