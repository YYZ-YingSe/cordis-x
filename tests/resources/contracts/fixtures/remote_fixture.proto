syntax = "proto3";
package fixtures.remote_fixture;
import "cordis/options.proto";
import "cordis/types.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message AddArgs {
  optional sint64 left = 1 [(cordis.schema.required) = true];
  optional sint64 right = 2 [(cordis.schema.required) = true];
}
message MetadataResult {
  optional string revision = 1 [(cordis.schema.required) = true];
  repeated google.protobuf.Value layers = 2;
}
message MetadataForArgs {
  optional string name = 1 [(cordis.schema.required) = true];
  optional string revision = 2 [(cordis.schema.required) = true];
}
message MetadataForResult {
  optional string revision = 1 [(cordis.schema.required) = true];
  repeated google.protobuf.Value layers = 2;
}
message StatusResult {
  optional bool open = 1 [(cordis.schema.required) = true];
  repeated string waiting = 2;
}
message CounterArgs {
  optional sint64 initial = 1;
  optional string name = 2;
  optional string wait = 3;
  optional bool fail_close = 4;
}
message CounterMetadataResult {
  optional string revision = 1 [(cordis.schema.required) = true];
  repeated google.protobuf.Value layers = 2;
}
service CounterResource {
  option (cordis.schema.resource) = true;
  rpc Get(google.protobuf.Empty) returns (google.protobuf.Int64Value) { option (cordis.schema.wire_name) = "get"; }
  rpc Add(google.protobuf.Int64Value) returns (google.protobuf.Int64Value) { option (cordis.schema.wire_name) = "add"; option (cordis.schema.errors) = "overflow"; }
  rpc CodeVersion(google.protobuf.Empty) returns (google.protobuf.StringValue) { option (cordis.schema.wire_name) = "code-version"; }
  rpc Metadata(google.protobuf.Empty) returns (CounterMetadataResult) { option (cordis.schema.wire_name) = "metadata"; }
  rpc Hold(google.protobuf.StringValue) returns (google.protobuf.StringValue) { option (cordis.schema.wire_name) = "hold"; }
  rpc Release(google.protobuf.StringValue) returns (google.protobuf.Empty) { option (cordis.schema.wire_name) = "release"; }
  rpc Crash(google.protobuf.Empty) returns (google.protobuf.Empty) { option (cordis.schema.wire_name) = "crash"; }
}
service Service {
  option (cordis.schema.contract) = { name: "example.calculator" revision: "1" config: "cordis.data.Unit"  };
  rpc CodeVersion(google.protobuf.Empty) returns (google.protobuf.StringValue) { option (cordis.schema.wire_name) = "code-version"; }
  rpc Echo(google.protobuf.Value) returns (google.protobuf.Value) { option (cordis.schema.wire_name) = "echo"; }
  rpc Add(AddArgs) returns (google.protobuf.Int64Value) { option (cordis.schema.wire_name) = "add"; option (cordis.schema.errors) = "overflow"; }
  rpc Metadata(google.protobuf.Empty) returns (MetadataResult) { option (cordis.schema.wire_name) = "metadata"; }
  rpc MetadataFor(MetadataForArgs) returns (MetadataForResult) { option (cordis.schema.wire_name) = "metadata-for"; }
  rpc Hold(google.protobuf.StringValue) returns (google.protobuf.StringValue) { option (cordis.schema.wire_name) = "hold"; }
  rpc Release(google.protobuf.StringValue) returns (google.protobuf.Empty) { option (cordis.schema.wire_name) = "release"; }
  rpc Crash(google.protobuf.Empty) returns (google.protobuf.Empty) { option (cordis.schema.wire_name) = "crash"; }
  rpc Status(google.protobuf.Empty) returns (StatusResult) { option (cordis.schema.wire_name) = "status"; }
  rpc Counter(CounterArgs) returns (cordis.data.Lease) { option (cordis.schema.wire_name) = "counter"; option (cordis.schema.acquires) = "fixtures.remote_fixture.CounterResource";  }
}
