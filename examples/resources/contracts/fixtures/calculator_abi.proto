syntax = "proto3";
package fixtures.calculator_abi;
import "cordis/options.proto";
import "cordis/types.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message AddArgs {
  optional sint64 left = 1 [(cordis.schema.required) = true];
  optional sint64 right = 2 [(cordis.schema.required) = true];
}
message CounterArgs {
  optional sint64 initial = 1;
}
service CounterResource {
  option (cordis.schema.resource) = true;
  rpc Get(google.protobuf.Empty) returns (google.protobuf.Int64Value) { option (cordis.schema.wire_name) = "get"; }
  rpc Add(google.protobuf.Int64Value) returns (google.protobuf.Int64Value) { option (cordis.schema.wire_name) = "add"; option (cordis.schema.errors) = "overflow"; }
  rpc CodeVersion(google.protobuf.Empty) returns (google.protobuf.StringValue) { option (cordis.schema.wire_name) = "code-version"; }
}
service Service {
  option (cordis.schema.contract) = { name: "example.calculator" revision: "1" config: "cordis.data.Unit"  };
  rpc CodeVersion(google.protobuf.Empty) returns (google.protobuf.StringValue) { option (cordis.schema.wire_name) = "code-version"; }
  rpc Echo(google.protobuf.Value) returns (google.protobuf.Value) { option (cordis.schema.wire_name) = "echo"; }
  rpc Add(AddArgs) returns (google.protobuf.Int64Value) { option (cordis.schema.wire_name) = "add"; option (cordis.schema.errors) = "overflow"; }
  rpc Counter(CounterArgs) returns (cordis.data.Lease) { option (cordis.schema.wire_name) = "counter"; option (cordis.schema.acquires) = "fixtures.calculator_abi.CounterResource";  }
}
