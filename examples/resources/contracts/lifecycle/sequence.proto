syntax = "proto3";
package lifecycle;
import "cordis/options.proto";
import "cordis/types.proto";
import "lifecycle/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "lifecycle/managed_status.proto";
service Sequences {
  option (cordis.schema.contract) = {
    name: "example.pipeline" revision: "1" config: "cordis.data.Unit"
    dependencies: { alias: "logger" service: "lifecycle.LifecycleLog" }
  };
  rpc Start(google.protobuf.StringValue) returns (google.protobuf.Empty) {
    option (cordis.schema.errors) = "duplicate_sequence";
  }
  rpc Ready(google.protobuf.StringValue) returns (Completion) {
    option (cordis.schema.errors) = "unknown_sequence";
    option (cordis.schema.errors) = "cleanup_failed";
  }
  rpc Release(google.protobuf.StringValue) returns (google.protobuf.Empty) {
    option (cordis.schema.errors) = "unknown_sequence";
    option (cordis.schema.errors) = "cleanup_failed";
  }
  rpc Status(google.protobuf.StringValue) returns (SequenceStatus) {
    option (cordis.schema.errors) = "unknown_sequence";
  }
  rpc Count(google.protobuf.StringValue) returns (google.protobuf.UInt64Value) {
    option (cordis.schema.errors) = "unknown_sequence";
  }
}
