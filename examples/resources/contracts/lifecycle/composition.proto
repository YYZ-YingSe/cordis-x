syntax = "proto3";
package lifecycle;
import "cordis/options.proto";
import "cordis/types.proto";
import "lifecycle/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
message CompositionConfig {
  enum Publication { NORMAL = 0; OMIT = 1; DUPLICATE = 2; }
  Publication publication = 1;
  bool fail_activate = 2;
}
service Composer {
  option (cordis.schema.contract) = { name: "example.composition" revision: "1" config: "lifecycle.CompositionConfig" };
  rpc Worker(WorkerConfig) returns (cordis.data.Child) {
    option (cordis.schema.installs) = true;
    option (cordis.schema.errors) = "worker_rejected";
  }
  rpc SettingsValue(Settings) returns (cordis.data.Unit) {
    option (cordis.schema.wire_name) = "settings";
    option (cordis.schema.provision) = { name: "example.settings" revision: "1" };
  }
  rpc Install(WorkerConfig) returns (ChildStatus) { option (cordis.schema.errors) = "duplicate_child"; option (cordis.schema.errors) = "worker_rejected"; }
  rpc InstallPending(WorkerConfig) returns (google.protobuf.Empty) { option (cordis.schema.errors) = "duplicate_child"; option (cordis.schema.errors) = "worker_rejected"; }
  rpc Release(google.protobuf.StringValue) returns (google.protobuf.Empty) { option (cordis.schema.errors) = "unknown_child"; }
  rpc Ready(google.protobuf.StringValue) returns (ChildStatus) { option (cordis.schema.errors) = "unknown_child"; }
  rpc Settled(google.protobuf.StringValue) returns (ChildStatus) { option (cordis.schema.errors) = "unknown_child"; }
  rpc Status(google.protobuf.StringValue) returns (ChildStatus) { option (cordis.schema.errors) = "unknown_child"; }
}
message ApplicationInfo {
  optional string name = 1 [(cordis.schema.required) = true];
  optional uint32 version = 2 [(cordis.schema.required) = true];
}
service Application {
  option (cordis.schema.contract) = { name: "example.application" revision: "1" config: "cordis.data.Unit" };
  rpc Worker(WorkerConfig) returns (cordis.data.Child) { option (cordis.schema.installs) = true; }
  rpc Info(ApplicationInfo) returns (cordis.data.Unit) { option (cordis.schema.provision) = { name: "example.info" revision: "1" }; }
  rpc Start(WorkerConfig) returns (ChildStatus);
}
