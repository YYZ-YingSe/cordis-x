[package]
publish = false
description = "Cordis framework: cordis-sdk-process"
name = "cordis-sdk-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cordis-sdk-core.workspace = true
cordis-wire.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net"] }
futures-util.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
cordis-example-contracts.workspace = true
cordis-sdk-runtime.workspace = true
cordis-kernel.workspace = true
cordis-portable-example = { path = "../examples/portable" }
cordis-remote = { path = "../../../crates/cordis-remote" }
cordis-runtime.workspace = true

[lints]
workspace = true

[[example]]
name = "resource_probe"
path = "tests/fixtures/resource_probe.rs"

[[example]]
name = "process_structural_probe"
path = "tests/fixtures/structural_probe.rs"
