name: Rust
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Each lane owns its runner, build directory and cache. Independent compilers
# can run concurrently without contending for one Cargo/CMake build lock.
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          tools: rust python typescript protoc
      - name: Test setup helpers
        run: python -m unittest discover -s tests/setup -v
      - run: cargo fmt --all -- --check
      - name: Test TypeScript SDK
        run: npm test --prefix sdk/typescript
      - name: Test generator paths and output ownership
        timeout-minutes: 15
        run: cargo test -p cordis-codegen --test compiler --features cordis-remote/loader --locked
      - name: Test TypeScript process startup and controls
        timeout-minutes: 15
        run: cargo test -p cordis-codegen --test process_controls generated_controls_typescript --features cordis-remote/loader --locked -- --exact --nocapture
      - name: Test script package startup from staging
        timeout-minutes: 15
        run: cargo test -p cordis-remote --features loader --test conformance updates::script_packages_start_from_unicode_staging --locked -- --exact --nocapture
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          tools: rust python typescript protoc cpp
      - name: Configure C++ SDK
        run: python tests/build.py --native --configure-only
      - name: Compile C++ API and generated dispatch
        run: python tests/build.py --native --target cordis_abi_calculator cordis_async_test cordis_codegen_test
      - name: Prepare native integration fixtures
        run: python tests/build.py --native
      - name: Test C++ SDK
        run: ctest --test-dir build/native -C Debug --output-on-failure
      - name: Test asynchronous ABI dispatch progress
        timeout-minutes: 20
        run: cargo test -p cordis-abi --features loader --test reactive dispatch_handle_outlives_method_and_caches_outcome --locked
      - name: Lint native Rust targets
        run: cargo clippy --workspace --exclude cordis-wasm --all-targets --features cordis-abi/loader,cordis-remote/loader --locked -- -D warnings
      - name: Compile native Rust tests
        run: cargo test --workspace --exclude cordis-wasm --no-run --features cordis-abi/loader,cordis-remote/loader --locked
      - name: Run native workspace tests
        timeout-minutes: 60
        run: cargo test --workspace --exclude cordis-wasm --features cordis-abi/loader,cordis-remote/loader --locked
      - run: cargo run -p cordis-sdk --example broker --locked
      - run: cargo run -p cordis-sdk --example lifecycle --locked
      - run: cargo run -p cordis-sdk --example stepwise --locked
      - run: cargo run -p cordis-sdk --example loader --locked
      - if: runner.os == 'Linux'
        run: cargo run -p cordis-abi --example library --locked -- build/native/bin/libcordis_abi_calculator.so
      - if: runner.os == 'macOS'
        run: cargo run -p cordis-abi --example library --locked -- build/native/bin/libcordis_abi_calculator.dylib
      - if: runner.os == 'Windows'
        run: cargo run -p cordis-abi --example library --locked -- build/native/bin/cordis_abi_calculator.dll
      - if: runner.os == 'Linux'
        run: cargo run -p cordis-abi --example abi_context --locked -- build/native/bin/libcordis_abi_context_example.so
      - if: runner.os == 'macOS'
        run: cargo run -p cordis-abi --example abi_context --locked -- build/native/bin/libcordis_abi_context_example.dylib
      - if: runner.os == 'Windows'
        run: cargo run -p cordis-abi --example abi_context --locked -- build/native/bin/cordis_abi_context_example.dll
      - if: runner.os == 'Linux'
        run: cargo run -p cordis-abi --example abi_managed --locked -- build/native/bin/libcordis_abi_managed_example.so
      - if: runner.os == 'macOS'
        run: cargo run -p cordis-abi --example abi_managed --locked -- build/native/bin/libcordis_abi_managed_example.dylib
      - if: runner.os == 'Windows'
        run: cargo run -p cordis-abi --example abi_managed --locked -- build/native/bin/cordis_abi_managed_example.dll
      - if: runner.os == 'Linux'
        run: cargo run -p cordis-abi --example abi_composition --locked -- build/native/bin/libcordis_abi_composition_example.so
      - if: runner.os == 'macOS'
        run: cargo run -p cordis-abi --example abi_composition --locked -- build/native/bin/libcordis_abi_composition_example.dylib
      - if: runner.os == 'Windows'
        run: cargo run -p cordis-abi --example abi_composition --locked -- build/native/bin/cordis_abi_composition_example.dll
      - if: runner.os == 'Linux'
        run: cargo run -p cordis-abi --example abi_reactive --locked -- build/native/bin/libcordis_abi_reactive_example.so
      - if: runner.os == 'macOS'
        run: cargo run -p cordis-abi --example abi_reactive --locked -- build/native/bin/libcordis_abi_reactive_example.dylib
      - if: runner.os == 'Windows'
        run: cargo run -p cordis-abi --example abi_reactive --locked -- build/native/bin/cordis_abi_reactive_example.dll
      # Installed packages need fresh roots; keep them outside the cached target tree.
      - run: python examples/package-native.py --build build/native --backend abi --output "${{ runner.temp }}/cordis-packages/abi"
      - run: cargo run -p cordis-abi --features loader --example abi_reload --locked -- "${{ runner.temp }}/cordis-packages/abi/v1/cordis-package.json" "${{ runner.temp }}/cordis-packages/abi/v2/cordis-package.json"
      - run: cargo run -p cordis-abi --features loader --example abi_rolling --locked -- "${{ runner.temp }}/cordis-packages/abi/v1/cordis-package.json" "${{ runner.temp }}/cordis-packages/abi/v2/cordis-package.json"
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example process --locked -- build/native/bin/cordis_calculator http
      - if: runner.os != 'Windows'
        run: python examples/package-native.py --build build/native --backend process --output "${{ runner.temp }}/cordis-packages/process"
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --features loader --example process_reload --locked -- "${{ runner.temp }}/cordis-packages/process/v1/cordis-package.json" "${{ runner.temp }}/cordis-packages/process/v2/cordis-package.json" ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --features loader --example process_rolling --locked -- "${{ runner.temp }}/cordis-packages/process/v1/cordis-package.json" "${{ runner.temp }}/cordis-packages/process/v2/cordis-package.json" http
      - run: node sdk/typescript/examples/package-calculator.mjs "${{ runner.temp }}/cordis-packages/ts/v1/cordis-package.json" v1
      - run: node sdk/typescript/examples/package-calculator.mjs "${{ runner.temp }}/cordis-packages/ts/v2/cordis-package.json" v2
      - shell: bash
        run: cargo run -p cordis-remote --features loader --example process_reload --locked -- "${{ runner.temp }}/cordis-packages/ts/v1/cordis-package.json" "${{ runner.temp }}/cordis-packages/ts/v2/cordis-package.json" ipc "$(node -p process.execPath)"
      - shell: bash
        run: cargo run -p cordis-remote --features loader --example process_rolling --locked -- "${{ runner.temp }}/cordis-packages/ts/v1/cordis-package.json" "${{ runner.temp }}/cordis-packages/ts/v2/cordis-package.json" http "$(node -p process.execPath)"
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example dependencies --locked -- http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example effects --locked -- cpp ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example effects --locked -- ts http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example sequence --locked -- cpp ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example sequence --locked -- ts http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example scopes --locked -- cpp ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example scopes --locked -- ts http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example tasks --locked -- cpp ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example tasks --locked -- ts http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example events --locked -- ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example events --locked -- http
      - run: cargo run -p cordis-remote --example intercepts --locked -- ts http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example intercepts --locked -- cpp ipc
      - run: cargo run -p cordis-remote --example composition --locked -- ts http
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example composition --locked -- cpp ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example middleware --locked -- ipc
      - if: runner.os != 'Windows'
        run: cargo run -p cordis-remote --example middleware --locked -- http
  wasm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          # Shared backend tests also start the TypeScript IPC/HTTP provider.
          tools: rust python typescript protoc cpp wasm
      # Tests build separate guest packages with --offline. Compiling only the
      # host crate does not populate their registry dependencies on a cold runner.
      - name: Fetch dependencies for offline guest builds
        run: cargo fetch --locked
      # The cross-backend control test also exercises one native ABI fixture.
      - name: Prepare ABI control comparison fixture
        run: python tests/build.py --native --target cordis_workflows_abi
      - name: Lint Wasm Rust targets
        run: cargo clippy -p cordis-wasm --all-targets --features cordis-wasm/loader,cordis-abi/loader,cordis-remote/loader --locked -- -D warnings
      - name: Compile Wasm tests
        run: cargo test -p cordis-wasm --no-run --features cordis-wasm/loader,cordis-abi/loader,cordis-remote/loader --locked
      - name: Run Wasm tests
        timeout-minutes: 60
        run: cargo test -p cordis-wasm --features cordis-wasm/loader,cordis-abi/loader,cordis-remote/loader --locked
      - run: cargo build -p cordis-wasm-calculator --target wasm32-unknown-unknown --release --locked
      - run: cargo run -p cordis-component-pack --locked -- target/wasm32-unknown-unknown/release/cordis_wasm_calculator.wasm target/calculator.component.wasm
      - run: cargo run -p cordis-wasm --example component --locked -- target/calculator.component.wasm
      - run: cargo build -p cordis-wasm-context-example --target wasm32-unknown-unknown --release --locked
      - run: cargo run -p cordis-component-pack --locked -- target/wasm32-unknown-unknown/release/cordis_wasm_context_example.wasm target/context.component.wasm
      - run: cargo run -p cordis-wasm --example context --locked -- target/context.component.wasm
      - run: cargo build -p cordis-wasm-context-example --target wasm32-unknown-unknown --release --features version-v2 --target-dir target/wasm-context-v2 --locked
      - run: cargo run -p cordis-component-pack --locked -- target/wasm-context-v2/wasm32-unknown-unknown/release/cordis_wasm_context_example.wasm target/context-v2.component.wasm
      - run: cargo run -p cordis-wasm --example context_rolling --locked -- target/context.component.wasm target/context-v2.component.wasm
      - run: cargo build -p cordis-wasm-calculator --target wasm32-unknown-unknown --release --features version-v2 --target-dir target/wasm-v2 --locked
      - run: cargo run -p cordis-component-pack --locked -- target/wasm-v2/wasm32-unknown-unknown/release/cordis_wasm_calculator.wasm target/calculator-v2.component.wasm
      - run: cargo run -p cordis-wasm --features loader --example reload --locked -- target/calculator.component.wasm target/calculator-v2.component.wasm
      - run: cargo run -p cordis-wasm --features loader --example rolling --locked -- target/calculator.component.wasm target/calculator-v2.component.wasm
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: ./.github/actions/prepare
        with:
          # Keep the MSRV toolchain selected above; only install host tools.
          tools: python protoc
      - run: cargo check --workspace --all-targets --features cordis-wasm/loader,cordis-abi/loader,cordis-remote/loader --locked
